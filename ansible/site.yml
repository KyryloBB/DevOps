---
- name: Apply common configuration to all hosts
  hosts: all
  become: yes
  roles:
    - common

- name: Configure PostgreSQL database server
  hosts: db
  become: yes
  roles:
    - db

- name: Configure Nginx and web application on worker
  hosts: workers
  become: yes
  roles:
    - worker

- name: Verify deployment
  hosts: workers
  become: yes
  roles:
    - verify