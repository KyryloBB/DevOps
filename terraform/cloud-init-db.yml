#cloud-config

ssh_pwauth: true

users:
  - name: ansible
    groups: [sudo]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      - ${ansible_ssh_key}

  - name: teacher
    groups: [sudo]
    shell: /bin/bash
    lock_passwd: false
    plain_text_passwd: '12345678'
  
chpasswd:
  expire: false

package_update: true
packages:
  - python3
  - python3-apt
  - curl
  - ca-certificates