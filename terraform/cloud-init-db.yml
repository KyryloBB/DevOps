#cloud-config

ssh_pwauth: true

users:
  - name: ansible
    groups: [sudo]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      - ${ansible_ssh_key}

  - name: teacher
    groups: [sudo]
    shell: /bin/bash
    lock_passwd: false
    plain_text_passwd: '12345678'
  
chpasswd:
  expire: false

packages:
  - python3

# Конфігурація мережі
write_files:
  - path: /etc/netplan/60-hostonly.yaml
    permissions: '0600'
    content: |
      network:
        version: 2
        ethernets:
          enp0s8:
            dhcp4: false
            addresses:
              - ${db_ip}/24

runcmd:
  - netplan apply
