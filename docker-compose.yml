services:

  db:
    image: postgres:16
    container_name: task_tracker_db
    restart: always
    environment:
      POSTGRES_DB: task_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: passwd_123
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - mywebapp_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d task_tracker"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: task_tracker_web
    restart: always
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5200/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      - ./config.json:/app/config.json
    networks:
      - mywebapp_net

  nginx:
    image: nginx:stable-alpine
    container_name: task_tracker_nginx
    restart: always
    ports:
      - 80:80
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
    networks:
      - mywebapp_net

networks:
  mywebapp_net:
    driver: bridge

volumes:
  db_data: