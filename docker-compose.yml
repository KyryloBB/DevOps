services:

  db:
    image: postgres:16
    container_name: task_tracker_db
    restart: always
    environment:
      POSTGRES_DB: task_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: passwd_123
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - mywebapp_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d task_tracker"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: task_tracker_web
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5200:5200"
    volumes:
      - ./config.json:/etc/mywebapp/config.json
    networks:
      - mywebapp_net

networks:
  mywebapp_net:
    driver: bridge

volumes:
  db_data: